[project]
name = "aws-cli-toolbox"
version = "0.1.0"
description = "Functions and configuration to streamline AWS CLI and boto3 use on macOS and Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "truststore>=0.10",
]

[project.scripts]
aws-toolbox = "aws_toolbox.cli:main"
aws-sso-refresh = "aws_toolbox.cli:sso_refresh_main"
aws-sts-decode = "aws_toolbox.cli:sts_decode_main"
aws-sync-profiles = "aws_toolbox.cli:sync_profiles_main"
aws-ssm-connect = "aws_toolbox.cli:ssm_connect_main"
ns-cert-refresh = "aws_toolbox.cli:ns_cert_refresh_main"
# aws-assume-role must export into the calling shell, so it is a shell
# function (shell/aws-toolbox.functions) wrapping `aws-toolbox assume-role`.

[dependency-groups]
dev = [
    "moto[organizations,sts]>=5.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real AWS credentials"]
addopts = "-m 'not integration'"
